android.nonTransitiveRClass=false

kotlin.code.style=official

# Configuration should be synced with [/gradle/build-logic/gradle.properties]
org.gradle.caching=true
# Cache Gradle configuration/task graph
org.gradle.configuration-cache=true
# Disabled for React Native. With configure-on-demand, an invocation naming tasks in more than one
# project can configure :app after AGP has already finalized the DSL, and applying
# `com.facebook.react` then fails with "It is too late to call finalizeDsl". Reproducible on a fresh
# daemon: `:app:assembleDebugAndroidTest` alone succeeds, `:js-runtime:assembleDebug
# :app:assembleDebugAndroidTest` fails, and `--no-configure-on-demand` fixes it. A build whose
# success depends on which tasks you happen to name in one command is not worth the configuration
# time it saves. See F16 in docs/superpowers/plans/m0-findings.md.
org.gradle.configureondemand=false
# Raised from 2048m for the React Native Gradle plugin: it is an included build, so every
# configuration compiles its Kotlin sources in-process alongside the app build. 2048m OOM-killed the
# daemon outright ("Gradle build daemon disappeared unexpectedly").
org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3072m
org.gradle.parallel=true

# React Native (M0 spike — docs/superpowers/plans/2026-07-27-m0-rn-brownfield-spike.md)
hermesEnabled=true
newArchEnabled=true
# Must stay in sync with the ABI split list in app/build.gradle.kts. A missing ABI here produces an
# APK for that architecture with no React Native native library — a runtime failure, not a build one.
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64
