name: Check Reader Runtime

on:
  pull_request:
    paths:
      - 'app/tools/reader-runtime/**'
      - 'app/tools/devtools-lite/**'
      - 'app/tools/generate-shipped-js-licenses.mjs'
      - 'app/build.gradle.kts'
      - 'app/src/test/js/**'
      - '.github/workflows/reader-checks.yml'
      - 'js-runtime/.nvmrc'
      - '.editorconfig'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/tools/reader-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: js-runtime/.nvmrc
          cache: npm
          cache-dependency-path: app/tools/reader-runtime/package-lock.json

      - name: Install reader runtime dependencies
        run: npm ci

      # Chromium acceptance tests remain opt-in via npm run browser.
      - name: Check reader types, lint, style, build and Node tests
        run: npm run check

      - name: Check pinned DevTools distribution preparation
        working-directory: .
        run: node app/tools/devtools-lite/test-dist.mjs
