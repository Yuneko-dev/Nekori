name: Check Reader Runtime

on:
  pull_request:
    paths:
      - 'packages/reader/**'
      - 'packages/videojs-bundle/**'
      - 'apps/android/app/tools/devtools-lite/**'
      - 'apps/android/app/tools/generate-shipped-js-licenses.mjs'
      - 'apps/android/app/build.gradle.kts'
      - 'apps/android/app/src/test/js/**'
      - '.github/workflows/reader-checks.yml'
      - 'packages/js-runtime/.nvmrc'
      - '.editorconfig'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/js-runtime/.nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Chromium acceptance tests remain opt-in via bun run browser.
      - name: Check reader types, lint, style, build and Node tests
        run: bun run --filter @nekori/reader check

      - name: Check pinned DevTools distribution preparation
        run: node apps/android/app/tools/devtools-lite/test-dist.mjs
