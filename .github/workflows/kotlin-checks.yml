name: Check Kotlin

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Kotlin ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        check: [style, tests]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # settings.gradle.kts resolves the React Native Gradle plugin from node_modules.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/js-runtime/.nvmrc

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Check Kotlin style
        if: matrix.check == 'style'
        run: apps/android/gradlew spotlessCheck --continue

      - name: Run unit tests and verify SQLDelight migrations
        if: matrix.check == 'tests'
        run: apps/android/gradlew testDebugUnitTest verifySqlDelightMigration --continue

      - name: Upload test reports
        if: failure() && matrix.check == 'tests'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: kotlin-test-reports-${{ github.sha }}
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: ignore
