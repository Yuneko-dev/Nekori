name: Build & Test App

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!fastlane/**'
      - '!i18n/src/commonMain/moko-resources/**/strings.xml'
      - '!i18n/src/commonMain/moko-resources/**/plurals.xml'
      - 'i18n/src/commonMain/moko-resources/base/strings.xml'
      - 'i18n/src/commonMain/moko-resources/base/plurals.xml'
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  build:
    name: Build, Test & (on main) Sign APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

      - name: Count Commits
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          git rev-list --count HEAD
          commit_count=$(git rev-list --count HEAD)
          echo "COMMIT_COUNT=$commit_count" >> $GITHUB_ENV

      - name: Verify Commit Count
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        run: |
          set -e

          echo "${{ env.COMMIT_COUNT }}"
          test ${{ env.COMMIT_COUNT }} -gt 1 || exit 1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The React Native Gradle plugin lives in js-runtime/node_modules, and settings.gradle.kts
      # resolves it by shelling out to `node` during settings evaluation. Without these three steps
      # the build dies before Gradle configures a single project.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The npm root is js-runtime/, not the repo root, so the action cannot find the
          # packageManager pin on its own.
          package_json_file: js-runtime/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: js-runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: js-runtime/pnpm-lock.yaml

      - name: Install JS runtime dependencies
        working-directory: js-runtime
        run: pnpm install --frozen-lockfile

      - name: Build release APK(s) from clean native/codegen state
        run: |
          ./gradlew clean
          ./gradlew assembleRelease

      - name: Build nightly APK(s) (unsigned)
        run: ./gradlew assembleNightly -Penable-updater

      - name: Run unit tests
        id: unit_tests
        run: ./gradlew testDebugUnitTest

      - name: Verify SQLDelight migrations
        run: ./gradlew verifySqlDelightMigration

      - name: Upload test report (if tests fail)
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-report-${{ github.sha }}
          path: app/build/reports/tests/testDebugUnitTest

      - name: Sign APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        uses: r0adkll/sign-android-release@f30bdd30588842ac76044ecdbd4b6d0e3e813478
        with:
          releaseDirectory: app/build/outputs/apk/nightly
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Clean up build artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        run: |
          set -e

          mv app/build/outputs/apk/nightly/app-universal-nightly-signed.apk nekori-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-arm64-v8a-nightly-signed.apk nekori-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-armeabi-v7a-nightly-signed.apk nekori-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-x86-nightly-signed.apk nekori-x86-r${{ env.COMMIT_COUNT }}.apk
          mv app/build/outputs/apk/nightly/app-x86_64-nightly-signed.apk nekori-x86_64-r${{ env.COMMIT_COUNT }}.apk


      - name: Upload signed APKs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        uses: actions/upload-artifact@v5
        with:
          name: signed-apks-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk


      - name: Create release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          repository: Yuneko-dev/Nekori-nightly
          tag_name: r${{ env.COMMIT_COUNT }}
          name: Nekori Nightly r${{ env.COMMIT_COUNT }}
          body: |
            Here are the latest nightly builds of Nekori. These builds are automatically generated from the main branch and may contain new features or bug fixes that are not yet available in the stable release.

            <!-->
            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `nekori-r${{ env.COMMIT_COUNT }}.apk`
          files: |
            nekori-r${{ env.COMMIT_COUNT }}.apk
            nekori-arm64-v8a-r${{ env.COMMIT_COUNT }}.apk
            nekori-armeabi-v7a-r${{ env.COMMIT_COUNT }}.apk
            nekori-x86-r${{ env.COMMIT_COUNT }}.apk
            nekori-x86_64-r${{ env.COMMIT_COUNT }}.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.NEKORI_BOT_TOKEN }}

      - name: Prune old releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Yuneko-dev/Nekori'
        uses: dev-drprasad/delete-older-releases@dfbe6be2a006e9475dfcbe5b8d201f1824c2a9fe # v0.3.4
        env:
          GITHUB_TOKEN: ${{ secrets.NEKORI_BOT_TOKEN }}
        with:
          repo: Yuneko-dev/Nekori-nightly
          keep_latest: 28
          delete_tags: true

      - name: Cleanup keystore
        if: always()
        run: rm -f release.keystore
