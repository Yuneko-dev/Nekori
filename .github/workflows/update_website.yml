name: Update website

on:
  release:
    types: 
      - published
      - deleted
      - edited

jobs:
  update_website:
    # Upstream only. This posts to tsundoku-otaku/website, which this fork neither owns nor has a
    # counterpart for, and the job has no gate of its own - without this it would fire on every
    # release here and go knocking on someone else's repository.
    if: github.repository == 'tsundoku-otaku/tsundoku'
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Update website
        run: |
          curl --fail-with-body -L \
          -X POST \
          -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer ${{ secrets.TSUNDOKU_BOT_TOKEN }}" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          https://api.github.com/repos/tsundoku-otaku/website/dispatches \
          -d '{"event_type":"app_release"}'
