name: Release
on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  get_tag:
    if: github.repository == 'Yuneko-dev/Nekori'
    name: Extract tag name
    runs-on: 'ubuntu-24.04'
    outputs:
      tag: ${{ steps.extract.outputs.tag }}

    steps:
      - name: Get tag name
        id: extract
        run: echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT

  build:
    if: github.repository == 'Yuneko-dev/Nekori'
    name: Build
    runs-on: 'ubuntu-24.04'
    needs: get_tag

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The React Native Gradle plugin lives in js-runtime/node_modules, and settings.gradle.kts
      # resolves it by shelling out to `node` during settings evaluation. Without these three steps
      # the build dies before Gradle configures a single project.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          # The npm root is js-runtime/, not the repo root, so the action cannot find the
          # packageManager pin on its own.
          package_json_file: js-runtime/package.json

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: js-runtime/.nvmrc
          cache: pnpm
          cache-dependency-path: js-runtime/pnpm-lock.yaml

      - name: Install JS runtime dependencies
        working-directory: js-runtime
        run: pnpm install --frozen-lockfile

      - name: Build
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APK
        uses: r0adkll/sign-android-release@a391126403df92c6a0a3988a829dd47f79b89ed7
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: '35.0.1'

      - name: Rename APK
        run: |
          set -e

          mv app/build/outputs/apk/release/app-universal-release-signed.apk nekori-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-arm64-v8a-release-signed.apk nekori-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-armeabi-v7a-release-signed.apk nekori-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86-release-signed.apk nekori-x86-${{ needs.get_tag.outputs.tag }}.apk
          mv app/build/outputs/apk/release/app-x86_64-release-signed.apk nekori-x86_64-${{ needs.get_tag.outputs.tag }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: nekori
          path: |
            nekori-${{ needs.get_tag.outputs.tag }}.apk
            nekori-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            nekori-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            nekori-x86-${{ needs.get_tag.outputs.tag }}.apk
            nekori-x86_64-${{ needs.get_tag.outputs.tag }}.apk

  release:
    if: github.repository == 'Yuneko-dev/Nekori'
    name: Create GitHub Release
    runs-on: ubuntu-24.04
    needs: [get_tag, build]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          merge-multiple: true

      - name: Delete all artifacts
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7a6b98377786765b # v5.1.0
        with:
          failOnError: false
          name: |
            nekori

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.get_tag.outputs.tag }}
          name: Nekori ${{ needs.get_tag.outputs.tag }}
          body: |
            Check out the [past release notes](https://github.com/Yuneko-dev/Nekori/releases) if you’re upgrading from an earlier version.

            <!-->

            ### Other
            - Probably added more bugs to fix later

            <!-->

            > [!TIP]
            >
            > ### If you are unsure which version to download then go with `nekori-${{ needs.get_tag.outputs.tag }}.apk`
          files: |
            nekori-${{ needs.get_tag.outputs.tag }}.apk
            nekori-arm64-v8a-${{ needs.get_tag.outputs.tag }}.apk
            nekori-armeabi-v7a-${{ needs.get_tag.outputs.tag }}.apk
            nekori-x86-${{ needs.get_tag.outputs.tag }}.apk
            nekori-x86_64-${{ needs.get_tag.outputs.tag }}.apk
          draft: true
          prerelease: false
          token: ${{ secrets.NEKORI_BOT_TOKEN }}
