name: Check JS Runtime

on:
  pull_request:
    paths:
      - 'packages/js-runtime/**'
      - '.editorconfig'
      - '.github/workflows/js-runtime-checks.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: JS runtime ${{ matrix.script }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script: [type-check, lint, 'format:check', 'test:chapter']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: packages/js-runtime/.nvmrc

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.script }}
        run: bun run --filter nekori-js-runtime ${{ matrix.script }}
